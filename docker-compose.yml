version: '3'
services:
  redis:
    image: redis:latest
    networks:
      - replyai-net
    container_name: redis
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - redis_data:/data
  
  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api
    networks:
      - replyai-net
    depends_on:
      - redis
      - db
    restart: always
    env_file:
      - evolutionapi.env
    volumes:
      - evolution_store:/evolution/store
      - evolution_instances:/evolution/instances

  replyai-api:
    container_name: replyai_api
    networks:
      - replyai-net
    build: .
    image: replyai-api:latest
    ports:
      - "8000:8000"
    env_file:
      - .env

  replyai-worker:
    container_name: replyai_worker
    image: replyai-api:latest
    depends_on:
      - replyai-api
      - redis
    networks:
      - replyai-net
    command: python -m app.queue.worker
    env_file:
      - .env

volumes:
  evolution_store:
  evolution_instances:
  redis_data:

networks:
  replyai-net:
    name: replyai-net
    driver: bridge