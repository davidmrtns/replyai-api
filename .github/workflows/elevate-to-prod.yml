name: Elevate to Production

on:
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Login Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PROD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PROD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PROD_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: replyai-api-prod
          resourceGroup: replyai
          imageToDeploy: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          registryUrl: ghcr.io
          registryUsername: davidmrtns
          registryPassword: ${{ secrets.PROD_REGISTRY_PASSWORD }}
